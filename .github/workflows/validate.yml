name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate Skill structure
        run: python3 skills/apple-photos-curator/scripts/validate_skill.py skills/apple-photos-curator

      - name: Validate repository contract
        run: python3 scripts/validate_skill.py .

      - name: Compile bundled scripts
        run: python3 -m py_compile skills/apple-photos-curator/scripts/*.py

      - name: Run release privacy scan
        run: python3 skills/apple-photos-curator/scripts/scan_release_privacy.py .
